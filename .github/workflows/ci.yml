name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: templates/cloudground/src/CloudGround.App.Web/.nvmrc

      - name: Test the template
        run: dotnet test --solution CloudGround.Templates.slnx

      - name: Pack the template
        run: dotnet pack CloudGround.Templates.csproj --configuration Release --output artifacts

      - name: Install the template
        run: dotnet new install artifacts/CloudGround.Templates.*.nupkg

      - name: Generate a solution with the sample
        run: dotnet new cloudground --name Contoso.Shop --output generated/contoso-shop

      - name: Generate a solution without the sample
        run: dotnet new cloudground --name Contoso.Empty --sample false --output generated/contoso-empty

      - name: Build and test the solution with the sample
        uses: ./generated/contoso-shop/.github/actions/build-and-test
        with:
          working-directory: generated/contoso-shop

      - name: Build and test the solution without the sample
        uses: ./generated/contoso-empty/.github/actions/build-and-test
        with:
          working-directory: generated/contoso-empty
