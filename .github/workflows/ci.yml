name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test the template
        run: dotnet test --solution CloudGround.Templates.slnx

      - name: Pack the template
        run: dotnet pack CloudGround.Templates.csproj --configuration Release --output artifacts

      - name: Install the template
        run: dotnet new install artifacts/CloudGround.Templates.*.nupkg

      - name: Generate a solution
        run: dotnet new cloudground --name Contoso.Shop --output generated/contoso-shop

      - uses: ./generated/contoso-shop/.github/actions/build-and-test
        with:
          working-directory: generated/contoso-shop
