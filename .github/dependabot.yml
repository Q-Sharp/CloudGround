version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /templates/cloudground
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.EntityFrameworkCore.*
        update-types: [version-update:semver-major]
      - dependency-name: dotnet-ef
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directories:
      - /templates/cloudground/src/CloudGround.App.Web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns: ["@angular/*", "angular-eslint", "typescript"]
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directories:
      - /templates/cloudground/src/CloudGround.App.Web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: devcontainers
    directories:
      - /templates/cloudground
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      devcontainers:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /templates/cloudground/.github/workflows
      - /templates/cloudground/.github/actions/build-and-test
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
